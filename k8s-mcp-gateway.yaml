apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-universal-gateway
  namespace: ai-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcp-gateway
  template:
    metadata:
      labels:
        app: mcp-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/pradeeptalari14/mcp-gateway:latest
          ports:
            - containerPort: 8088
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-universal-gateway
  namespace: ai-platform
spec:
  selector:
    app: mcp-gateway
  ports:
    - port: 8088
      targetPort: 8088
